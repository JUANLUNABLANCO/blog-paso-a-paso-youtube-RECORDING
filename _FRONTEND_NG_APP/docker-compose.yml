version: '2'
services:
  postgres:
    image: 'postgres:15-alpine'
    restart: always
    volumes:
      - './postgres_data:/var/lib/postgresql/data'
    environment:
      - POSTGRES_USER=test_cypress
      - POSTGRES_PASSWORD=test123
      - POSTGRES_DB=blogTest
    ports:
      - '5432:5432'
